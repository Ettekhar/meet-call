<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    height: 100%;
    height: 100dvh; /* accounts for mobile browser chrome */
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  /* ---- status bar ---- */
  #status {
    text-align: center;
    padding: 10px;
    background: #1c1c1c;
    font-size: 13px;
    color: #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  #statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #666;
    display: inline-block;
    flex-shrink: 0;
  }
  #statusDot.connected { background: #3bb273; }
  #statusDot.waiting { background: #d8a13a; }
  #qualityBadge, #roomBadge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #2a2a2a;
    color: #bbb;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  #qualityBadge:empty { display: none; }

  /* ---- video area ---- */
  #videos {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 0;
  }
  video {
    background: #1a1a1a;
    border-radius: 8px;
  }
  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #localVideo {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 110px;
    height: 82px;
    object-fit: cover;
    border: 2px solid #444;
    z-index: 2;
    border-radius: 8px;
  }
  #locationPanel {
    position: absolute;
    bottom: 12px;
    left: 12px;
    width: 190px;
    max-width: calc(100% - 24px);
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    z-index: 3;
    display: none;
  }
  #locationPanel.visible { display: block; }
  #locationMap { width: 100%; height: 110px; background: #222; }
  #locationInfo { padding: 8px 10px; font-size: 11px; color: #ccc; }
  #locationInfo a { color: #6fb7ff; text-decoration: none; }

  /* ---- controls ---- */
  #controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #1c1c1c;
    flex-wrap: wrap;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    position: relative;
    min-height: 44px; /* touch target */
    min-width: 44px;
  }
  button:hover { background: #3a3a3a; }
  button:active { background: #444; }
  button.active { background: #b23b3b; border-color: #b23b3b; }
  button.on { background: #2a6b4a; border-color: #2a6b4a; }
  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #e0483e;
    color: #fff;
    border-radius: 999px;
    font-size: 10px;
    padding: 1px 6px;
    display: none;
  }
  .badge.show { display: inline-block; }

  /* ---- chat: side panel on desktop, bottom sheet on mobile ---- */
  #chatPanel {
    width: 300px;
    flex-shrink: 0;
    background: #17181a;
    border-left: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  #chatPanel.open { transform: translateX(0); }
  #chatHeader {
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #chatCloseBtn {
    display: none;
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    padding: 0 6px;
    min-height: auto;
    min-width: auto;
  }
  #chatMessages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.35;
    word-wrap: break-word;
  }
  .msg.me { align-self: flex-end; background: #2a6b4a; }
  .msg.them { align-self: flex-start; background: #2a2a2a; }
  .msg .time { display: block; font-size: 10px; color: #aaa; margin-top: 2px; }
  #chatInputRow {
    display: flex;
    padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    gap: 8px;
    border-top: 1px solid #2a2a2a;
  }
  #chatInput {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    color: #eee;
    padding: 10px 12px;
    font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
    min-height: 44px;
  }
  #chatInput:focus { outline: none; border-color: #555; }

  /* ================= MOBILE ================= */
  @media (max-width: 700px) {
    #app { flex-direction: column; }

    #localVideo {
      width: 84px;
      height: 64px;
      top: 8px;
      right: 8px;
    }
    #locationPanel {
      width: 150px;
      bottom: 8px;
      left: 8px;
    }
    #locationMap { height: 85px; }

    #controls {
      gap: 6px;
    }
    #controls button {
      flex: 1 1 auto;
      font-size: 12px;
      padding: 10px 8px;
    }

    /* Chat becomes a bottom sheet instead of a side panel */
    #chatPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 65vh;
      height: 65dvh;
      border-left: none;
      border-top: 1px solid #2a2a2a;
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
      z-index: 10;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    }
    #chatPanel.open { transform: translateY(0); }
    #chatCloseBtn { display: block; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="main">
    <div id="status">
      <span id="statusDot"></span>
      <span id="statusText">Starting camera...</span>
      <span id="roomBadge"></span>
      <span id="qualityBadge"></span>
    </div>

    <div id="videos">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>

      <div id="locationPanel">
        <div id="locationMap"></div>
        <div id="locationInfo">No location shared</div>
      </div>
    </div>

    <div id="controls">
      <button id="micBtn">Mute Mic</button>
      <button id="camBtn">Camera Off</button>
      <button id="locBtn">Location</button>
      <button id="chatBtn">Chat<span id="chatBadge" class="badge">•</span></button>
    </div>
  </div>

  <div id="chatPanel">
    <div id="chatHeader">
      Chat
      <button id="chatCloseBtn" aria-label="Close chat">&times;</button>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input id="chatInput" type="text" placeholder="Type a message..." />
      <button id="chatSendBtn">Send</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="client.js"></script>
</body>
</html>
