<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Call</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    height: 100%;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #status {
    text-align: center;
    padding: 8px;
    background: #1c1c1c;
    font-size: 13px;
    color: #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #666;
    display: inline-block;
  }
  #statusDot.connected { background: #3bb273; }
  #statusDot.waiting { background: #d8a13a; }
  #qualityBadge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #2a2a2a;
    color: #bbb;
    letter-spacing: 0.3px;
  }
  #qualityBadge:empty { display: none; }
  #videos {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 0;
  }
  video {
    background: #1a1a1a;
    border-radius: 8px;
  }
  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #localVideo {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 160px;
    height: 120px;
    object-fit: cover;
    border: 2px solid #444;
    z-index: 2;
    border-radius: 8px;
  }
  #locationPanel {
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 220px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    z-index: 3;
    display: none;
  }
  #locationPanel.visible { display: block; }
  #locationMap {
    width: 100%;
    height: 130px;
    background: #222;
  }
  #locationInfo {
    padding: 8px 10px;
    font-size: 12px;
    color: #ccc;
  }
  #locationInfo a { color: #6fb7ff; text-decoration: none; }
  #controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: #1c1c1c;
    flex-wrap: wrap;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    position: relative;
  }
  button:hover { background: #3a3a3a; }
  button.active { background: #b23b3b; border-color: #b23b3b; }
  button.on { background: #2a6b4a; border-color: #2a6b4a; }
  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #e0483e;
    color: #fff;
    border-radius: 999px;
    font-size: 10px;
    padding: 1px 6px;
    display: none;
  }
  .badge.show { display: inline-block; }

  #chatPanel {
    width: 300px;
    background: #17181a;
    border-left: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  #chatPanel.open { transform: translateX(0); }
  #chatHeader {
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid #2a2a2a;
  }
  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg {
    max-width: 85%;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.35;
    word-wrap: break-word;
  }
  .msg.me {
    align-self: flex-end;
    background: #2a6b4a;
  }
  .msg.them {
    align-self: flex-start;
    background: #2a2a2a;
  }
  .msg .time {
    display: block;
    font-size: 10px;
    color: #aaa;
    margin-top: 2px;
  }
  #chatInputRow {
    display: flex;
    padding: 10px;
    gap: 6px;
    border-top: 1px solid #2a2a2a;
  }
  #chatInput {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
    padding: 8px 10px;
    font-size: 13px;
  }
  #chatInput:focus { outline: none; border-color: #555; }
</style>
</head>
<body>

<div id="app">
  <div id="main">
    <div id="status"><span id="statusDot"></span><span id="statusText">Starting camera...</span><span id="qualityBadge"></span></div>

    <div id="videos">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>

      <div id="locationPanel">
        <div id="locationMap"></div>
        <div id="locationInfo">No location shared</div>
      </div>
    </div>

    <div id="controls">
      <button id="micBtn">Mute Mic</button>
      <button id="camBtn">Turn Off Camera</button>
      <button id="locBtn">Share Location</button>
      <button id="chatBtn">Chat<span id="chatBadge" class="badge">•</span></button>
    </div>
  </div>

  <div id="chatPanel">
    <div id="chatHeader">Chat</div>
    <div id="chatMessages"></div>
    <div id="chatInputRow">
      <input id="chatInput" type="text" placeholder="Type a message..." />
      <button id="chatSendBtn">Send</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="client.js"></script>
</body>
</html>
